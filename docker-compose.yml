services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:version-8.0.0
    ports:
      - "6006:6006"
      - "4317:4317"
    volumes:
      - phoenix_data:/phoenix/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      LOCAL_DEV_MODE: "false"
      QDRANT_URL: http://qdrant:6333
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      CHECKPOINT_PATH: /data/checkpoints.sqlite
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LLM_TIER: free
      FREE_MODELS_ONLY: "true"
      GEMINI_MODEL: gemini-2.5-flash
      GROQ_MODEL: openai/gpt-oss-120b
      ROUTEWAY_MODEL: deepseek-v4.1-flash:free
    volumes:
      - api_checkpoints:/data
    depends_on:
      qdrant:
        condition: service_healthy
      phoenix:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  qdrant_data:
  phoenix_data:
  api_checkpoints:
