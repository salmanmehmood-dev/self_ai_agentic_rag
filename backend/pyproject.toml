[project]
name = "agentic-crag"
version = "0.1.0"
description = "Corrective & Self-Reflective Agentic RAG"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "tenacity>=9.1.4",
  "google-genai>=3.0.0",
  "groq>=1.7.0",
  "qdrant-client>=1.20.0",
  "langgraph>=1.2.20",
  "duckduckgo-search>=8.1.1",
  "httpx>=0.27.0",
  "pymupdf>=1.24.0",
  "python-multipart>=0.0.9",
  "structlog>=24.4.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "aiosqlite>=0.20.0",
  "openai>=3.46.0",
  "fastembed>=0.9.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "respx>=0.23.1",
]
otel = [
  "arize-phoenix-otel>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_crag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentic_crag"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
ignore_missing_imports = true
